[project]
name = "apo"
version = "1.0.0"
description = "A tool for automatically optimize prompts used for creating a persona-based LLM agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.7.0",
    "cyclopts>=3.19.0",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=0.33.0",
    "langchain>=0.3.25",
    "langchain-openai>=0.3.24",
    "litellm>=1.73.0",
    "loguru>=0.7.3",
    "numpy>=2.3.0",
    "openai>=1.88.0",
    "progiter>=2.0.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.0",
    "torch>=2.7.1",
    "transformers>=4.52.4",
    "wandb>=0.20.1",
]